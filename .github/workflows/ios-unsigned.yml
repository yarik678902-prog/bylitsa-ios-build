name: Bylitsa unsigned iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Download and verify published source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output source.zip https://bylitsa.193-108-115-19.sslip.io/downloads/Bylitsa-3.0.1-Source.zip
          echo '71162fece7b59167607c0922745e370c8bf1ca8819af0f274290c4bd2fb46add  source.zip' | shasum -a 256 -c -
          unzip -q source.zip -d source
          xcodebuild -version
      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: false
      - name: Build device app without signing
        working-directory: source/Bylitsa-Matrix/app
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter config --enable-swift-package-manager
          flutter pub get
          flutter build ios --release --no-codesign
      - name: Verify and package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="$PWD/source/Bylitsa-Matrix/app/build/ios/iphoneos"
          export APP_DIR
          python3 - <<'PY'
          import os, pathlib, plistlib, subprocess
          apps = list(pathlib.Path(os.environ['APP_DIR']).glob('*.app'))
          assert len(apps) == 1, apps
          app = apps[0]
          with (app / 'Info.plist').open('rb') as f:
              info = plistlib.load(f)
          assert info['CFBundleIdentifier'] == 'ru.bylitsa.matrix', info
          binary = app / info['CFBundleExecutable']
          archs = subprocess.check_output(['lipo', '-archs', str(binary)], text=True)
          assert 'arm64' in archs, archs
          platform = subprocess.check_output(['xcrun', 'vtool', '-show-build', str(binary)], text=True)
          assert 'platform IOS' in platform and 'IOSSIMULATOR' not in platform, platform
          print(info['CFBundleIdentifier'], info['CFBundleShortVersionString'], archs, platform)
          subprocess.run(['ditto', str(app), 'stage/Payload/Bylitsa.app'], check=True)
          PY
          mkdir -p artifacts
          ditto -c -k --keepParent stage/Payload artifacts/Bylitsa-3.0.1-iOS-unsigned.ipa
          unzip -tq artifacts/Bylitsa-3.0.1-iOS-unsigned.ipa
          shasum -a 256 artifacts/*.ipa | tee artifacts/SHA256SUMS.txt
          echo 'Unsigned device build. Sign the app, extensions and frameworks before installation.' > artifacts/README.txt
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Bylitsa-3.0.1-iOS-unsigned
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7
